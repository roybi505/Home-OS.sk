<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home OS</title>
<meta name="theme-color" content="#18181B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home OS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">

<style>
:root{
  /* ---- design tokens ----
     background / surface / elevated-surface / text-primary / text-secondary /
     accent / success / warning / danger — the reusable palette.
     --surface-2 doubles as "elevated surface" (stepper buttons, inputs-on-input). */
  /* Quiet Home: neutral charcoal chrome, orange reserved for genuine
     actionable moments (primary CTAs, active tab, real alerts) rather
     than general interface surface — see docs/DECISIONS.md. */
  --bg:#18181B;
  --surface:#202024;      --card:#202024;      /* alias kept: many call sites still say --card */
  --surface-2:#28282D;    --soft:#28282D;      /* alias kept: --soft == elevated surface */
  --line:#343439; --line2:#28282D;
  --text:#EDEDEF;   --ink:#EDEDEF;             /* text-primary  (alias: --ink) */
  --text-2:#A5A5AD; --ink2:#A5A5AD;            /* text-secondary */
  --text-3:#77777F; --ink3:#77777F;
  --accent:#D9922E; --accent-ink:#241708; --accent-soft:#332B20;
  --warning:#E8B34A; --warn:#E8B34A; --warn-soft:#332C1E;
  --danger:#E2685B;  --danger-soft:#332221;
  --success:#6FB88F; --ok:#6FB88F; --ok-soft:#1E2B25;
  --fab-bg:#28282D;

  /* spacing scale */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  /* radii scale */
  --rad-sm:10px; --rad-md:16px; --rad-lg:22px; --rad-full:999px;
  --r:var(--rad-md);

  --shadow:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.24);
  --shadow-lg:0 8px 24px rgba(0,0,0,.38);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Rubik","Assistant","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.45;
  display:flex; flex-direction:column; height:100dvh; overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
input,select,textarea{
  width:100%; background:var(--surface); border:1px solid var(--line); border-radius:var(--rad-sm);
  padding:10px 12px; outline:none;
}
input:focus,select,textarea:focus{border-color:var(--accent)}
select{appearance:none;background:var(--surface)}
.hidden{display:none !important}
.row{display:flex;align-items:center;gap:var(--sp-2)}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;unicode-bidi:plaintext}
.muted{color:var(--text-3);font-size:12px}
.bidi{unicode-bidi:plaintext}
.icon{display:inline-flex;flex-shrink:0}
.icon svg{display:block}
.scroll-x{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scroll-x::-webkit-scrollbar{display:none}

/* header — simplified: brand + sync state + settings only */
header{background:var(--surface);border-bottom:1px solid var(--line);
  padding:var(--sp-3) var(--sp-4);flex-shrink:0}
.brand{font-weight:700;font-size:17px;letter-spacing:-.2px}
.iconbtn{
  width:36px;height:36px;border-radius:var(--rad-sm);display:flex;align-items:center;
  justify-content:center;background:var(--surface-2);flex-shrink:0;color:var(--text-2)
}
.iconbtn.on{background:var(--accent-soft);color:var(--accent)}
.home-badge{width:34px;height:34px;border-radius:var(--rad-sm);background:var(--accent);
  color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}

/* generic filter chip — used sparingly now (inside Supplies/Kitchen only) */
.chip{
  display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--rad-full);
  font-size:12.5px;font-weight:600;white-space:nowrap;
  background:var(--surface);border:1px solid var(--line);color:var(--text-2);flex-shrink:0
}
.chip.on{background:var(--surface-2);color:var(--text);border-color:var(--text-3)}
.search{position:relative}
.search input{padding-right:36px;background:var(--surface-2);border-color:transparent}
.search span{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--text-3)}

main{flex:1;overflow-y:auto;padding:var(--sp-4);padding-bottom:172px;-webkit-overflow-scrolling:touch}
.section-title{font-size:13px;font-weight:700;color:var(--text-2);
  text-transform:uppercase;letter-spacing:.03em;margin:var(--sp-5) 0 var(--sp-2)}
.section-title:first-child{margin-top:0}

/* ---- Home dashboard ---- */
.hero{background:var(--surface);border-radius:var(--rad-lg);padding:var(--sp-5);
  box-shadow:var(--shadow);margin-bottom:var(--sp-4)}
.hero-ring{width:64px;height:64px;border-radius:50%;flex-shrink:0}
.hero-title{font-size:14.5px;color:var(--text-2);margin-bottom:2px}
.hero-value{font-size:26px;font-weight:700}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-bottom:var(--sp-2)}
.dash-card{background:var(--surface);border-radius:var(--rad-lg);padding:var(--sp-4);
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:var(--sp-2);min-height:104px}
.dash-card:active{transform:scale(.98)}
.dash-card .ic{width:38px;height:38px;border-radius:var(--rad-sm);display:flex;
  align-items:center;justify-content:center;background:var(--surface-2)}
.dash-card .lbl{font-size:14px;font-weight:700}
.dash-card .sub{font-size:12.5px;color:var(--text-2)}
.attn-card{background:var(--surface);border-radius:var(--rad-md);padding:var(--sp-3) var(--sp-4);
  box-shadow:var(--shadow);display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-2)}
.attn-card .dot-status{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* ---- big product/family cards (Supplies & Kitchen) ---- */
.plist{display:flex;flex-direction:column;gap:var(--sp-2)}
.pcard{background:var(--surface);border-radius:var(--rad-lg);border:1px solid var(--line2);
  padding:var(--sp-3) var(--sp-4);display:flex;align-items:center;gap:var(--sp-3);position:relative}
.pcard.out{border-color:var(--danger-soft)}
.pcard .swatch{width:44px;height:44px;border-radius:var(--rad-sm);display:flex;align-items:center;
  justify-content:center;flex-shrink:0;background:var(--surface-2);color:var(--text-2)}
.pcard .info{flex:1;min-width:0}
.pcard .name{font-weight:600;font-size:14.5px}
.pcard .sub{font-size:12.5px;color:var(--text-2);margin-top:1px}
.pcard .status-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--rad-full);
  display:inline-block;margin-top:4px}
.status-tag.low{background:var(--warn-soft);color:var(--warning)}
.status-tag.out{background:var(--danger-soft);color:var(--danger)}
.status-tag.ok{background:var(--ok-soft);color:var(--success)}
.fam-badge{font-size:10.5px;color:var(--text-3);font-weight:600}

.stepper{display:flex;align-items:center;gap:3px}
.stepper button{width:26px;height:26px;border-radius:8px;background:transparent;
  border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--text-2)}
.stepper button:active{transform:scale(.92);background:var(--surface-2)}
.stepper .n{width:30px;text-align:center;font-weight:700;font-size:13px}
.stepper .n.z{color:var(--danger)}

/* zone tabs (Kitchen) */
.zonebar{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.zonebar .chip{flex:1;justify-content:center;padding:9px 8px}

/* Shopping buckets */
.shop-bucket{margin-bottom:var(--sp-2)}
.shop-item{display:flex;align-items:center;gap:var(--sp-3);padding:11px var(--sp-4);
  background:var(--surface);border-bottom:1px solid var(--line2)}
.shop-item:first-child{border-radius:var(--rad-md) var(--rad-md) 0 0}
.shop-item:last-child{border-bottom:0;border-radius:0 0 var(--rad-md) var(--rad-md)}
.shop-item:only-child{border-radius:var(--rad-md)}
.tick{width:23px;height:23px;border-radius:7px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;color:#fff}
.tick.on{background:var(--success);border-color:var(--success)}
.need{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  padding:3px 9px;border-radius:var(--rad-sm);flex-shrink:0}

/* badges (used on pcard) */
.badge{position:absolute;top:10px;left:10px;font-size:9.5px;font-weight:700;
  padding:2px 7px;border-radius:var(--rad-sm)}
.badge.low{background:var(--warn-soft);color:var(--warning)}
.badge.out{background:var(--danger-soft);color:var(--danger)}

.thumb{width:44px;height:44px;border-radius:var(--rad-sm);object-fit:cover;flex-shrink:0;background:var(--surface-2)}
.photo-box{width:100%;height:150px;border-radius:var(--rad-md);background:var(--surface-2);object-fit:cover;
  display:block;border:1px solid var(--line)}
.photo-empty{width:100%;height:90px;border-radius:var(--rad-md);background:var(--surface-2);border:1px dashed var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:12.5px}

.empty{text-align:center;padding:52px 20px;color:var(--text-3)}
.empty .icon{margin:0 auto 10px;color:var(--text-3)}

/* ---- bottom persistent UI: ask bar + tab nav ---- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:linear-gradient(180deg, transparent, var(--bg) 28%);
  padding:0 var(--sp-3) calc(var(--sp-2) + env(safe-area-inset-bottom))}
.askbar{display:flex;align-items:center;gap:var(--sp-2);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--rad-full);padding:6px 6px 6px var(--sp-4);
  box-shadow:var(--shadow-lg);margin-bottom:var(--sp-2)}
.askbar input{border:0;background:none;padding:8px 0;flex:1}
.askbar input:focus{border:0}
.askbar button{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;color:var(--text-2)}
.askbar .send{background:var(--accent);color:var(--accent-ink)}
.tabbar{display:flex;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--rad-lg);box-shadow:var(--shadow-lg);overflow:hidden}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 4px 8px;color:var(--text-3);font-size:10.5px;font-weight:600}
.tabbar button.on{color:var(--accent)}
.tabbar button .icon{color:inherit}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;
  border-radius:var(--rad-lg) var(--rad-lg) 0 0;padding:var(--sp-4) var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-bottom));
  border:1px solid var(--line);border-bottom:none}
@media(min-width:560px){.overlay{align-items:center;padding:16px}.sheet{border-radius:var(--rad-lg);border-bottom:1px solid var(--line)}}
.sheet h2{font-size:17px;font-weight:700;margin-bottom:2px}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{width:100%;padding:12px;border-radius:var(--rad-sm);font-weight:700;font-size:14.5px;
  background:var(--surface-2);color:var(--text);text-align:center}
.btn.a{background:var(--accent);color:var(--accent-ink)}
.btn.g{background:var(--surface-2);color:var(--text)}
.btn.r{background:var(--danger-soft);color:var(--danger)}
.btn:active{transform:scale(.985)}

/* settings: consumer rows + collapsible advanced */
.setrow{display:flex;align-items:center;gap:var(--sp-3);background:var(--surface);
  border-radius:var(--rad-md);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-2)}
.setrow .ic{width:34px;height:34px;border-radius:var(--rad-sm);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.setrow .t{font-weight:600;font-size:13.5px}
.setrow .s{font-size:12px;color:var(--text-2)}
details.adv{margin-top:var(--sp-5)}
details.adv > summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--text-2);
  list-style:none;padding:var(--sp-2) 0}
details.adv > summary::-webkit-details-marker{display:none}
details.adv > summary::before{content:'▸ '}
details.adv[open] > summary::before{content:'▾ '}

/* ---- AI review sheet (parse_command confirmation, staging, dedupe) ---- */
.srow{padding:10px 0;border-bottom:1px solid var(--line2)}
.srow:last-child{border-bottom:0}
.srow .two{gap:6px;margin-top:6px}
.srow input,.srow select{padding:7px 9px;font-size:13px}
.pill{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;flex-shrink:0}
.pill.new{background:var(--ok-soft);color:var(--success)}
.pill.upd{background:var(--accent-soft);color:var(--accent)}
.pill.use{background:var(--danger-soft);color:var(--danger)}
.group{background:var(--surface);border-radius:var(--rad-md);overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow)}

/* camera + scan staging */
#cam{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--rad-md);background:#000;display:block}
.shots{display:flex;gap:6px;overflow-x:auto;margin-top:8px;min-height:4px}
.shots figure{position:relative;flex-shrink:0}
.shots img{height:54px;border-radius:8px;border:1px solid var(--line);display:block}
.shots button{position:absolute;top:-4px;left:-4px;width:18px;height:18px;border-radius:50%;
  background:var(--danger);color:#fff;font-size:11px;line-height:1;display:flex;
  align-items:center;justify-content:center}
.shutter{width:62px;height:62px;border-radius:50%;background:#fff;border:4px solid var(--text);
  margin:12px auto;display:block}
.shutter:active{transform:scale(.9)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* toast */
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;
  transform:translate(-50%,-140%);z-index:99;background:var(--surface);color:var(--text);
  border:1px solid var(--line);
  padding:10px 16px;border-radius:var(--rad-sm);font-size:13.5px;font-weight:600;
  transition:transform .22s ease;box-shadow:var(--shadow-lg);max-width:90vw}
#toast.show{transform:translate(-50%,0)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text-3);flex-shrink:0}
.dot.on{background:var(--success)} .dot.err{background:var(--danger)}
</style>
</head>
<body>

<header>
  <div class="row">
    <div class="home-badge">🏠</div>
    <div class="grow">
      <div class="brand" id="tabTitle">Home OS</div>
      <div class="row" style="gap:5px"><span class="dot" id="syncDot"></span><span class="muted" id="syncTxt">מקומי בלבד</span></div>
    </div>
    <button class="iconbtn" id="btnSettings" title="הגדרות">⚙️</button>
  </div>
</header>

<main>
  <div id="view"></div>
</main>

<div class="bottombar">
  <div class="askbar">
    <button class="iconbtn" id="askCam" title="סרוק ארון" style="background:none"></button>
    <input id="askInput" type="text" dir="auto" placeholder="ספר ל-Home OS מה קרה…">
    <button class="send" id="askSend" title="שלח"></button>
  </div>
  <div class="tabbar">
    <button data-tab="home" class="on"><span class="icon"></span>בית</button>
    <button data-tab="supplies"><span class="icon"></span>מצרכים</button>
    <button data-tab="kitchen"><span class="icon"></span>מטבח</button>
    <button data-tab="shopping"><span class="icon"></span>קניות</button>
  </div>
</div>

<div id="toast"></div>
<div id="modals"></div>

<script>
"use strict";
/* ============================================================
   HOME OS — single-file, local-first, optional Firebase sync
   Data lives in localStorage. Firebase (if configured) mirrors it.
   ============================================================ */

const LS_DATA = 'homeos_v2';
const LS_FB   = 'homeos_fbcfg';
const MAX_EVENTS = 500;
const SCHEMA_VERSION = 2;

const DEFAULT_SPACES = [
  {id:'bathroom', name:'חדר רחצה',  emoji:'🚿'},
  {id:'kitchen',  name:'מטבח ומזווה', emoji:'🍳'},
  {id:'bedroom',  name:'חדר שינה',  emoji:'🛏️'},
  {id:'study',    name:'עמדת לימוד', emoji:'🩺'},
];
const DEFAULT_CATS = [
  {id:'grooming',     name:'בישום וטיפוח', emoji:'🧴'},
  {id:'bath_hygiene', name:'רחצה והיגיינה', emoji:'🧼'},
  {id:'laundry_home', name:'כביסה ורענון',  emoji:'👕'},
  {id:'food',         name:'מזון ומשקאות',  emoji:'🥫'},
  {id:'coffee',       name:'קפה',           emoji:'☕'},
  {id:'medstudy',     name:'ציוד לימודים',  emoji:'📚'},
  {id:'health',       name:'עזרה ראשונה',   emoji:'🩹'},
];
/* categories confidently classified as fast-cycle kitchen stock during
   migration — everything else defaults to "supply" (the app's original,
   safe behavior) rather than guessing */
const KITCHEN_CAT_IDS = new Set(['food','coffee']);

const ZONE_LABEL = { fridge:'מקרר', pantry:'מזווה', freezer:'מקפיא' };
const ZONES = ['pantry','fridge','freezer'];

/* ---------- tiny inline icon system ----------
   Replaces emoji as the primary category/product icon. Stroke-based,
   currentColor, so they theme automatically. Falls back to a generic
   box for anything unmapped — never emoji, per the redesign brief. */
const ICON_PATHS = {
  bottle:  'M9 2h6v3.2l2 2.3V22H7V7.5l2-2.3V2Z M9 2h6',
  droplet: 'M12 3c3 4 6 7.2 6 10.5A6 6 0 1 1 6 13.5C6 10.2 9 7 12 3Z',
  shirt:   'M8 3 4 6l2 3 2-1v13h8V8l2 1 2-3-4-3-2 2h-2L8 3Z',
  cart:    'M3 4h2l2.4 12.2A2 2 0 0 0 9.4 18H18a2 2 0 0 0 2-1.7L21 8H6',
  coffee:  'M4 8h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Z M17 9h1.5a2.5 2.5 0 0 1 0 5H17 M3 21h15',
  book:    'M5 4h9a3 3 0 0 1 3 3v13H8a3 3 0 0 0-3 3V4Z M17 20a3 3 0 0 0-3-3H5',
  cross:   'M12 4v16M4 12h16',
  box:     'M3 8 12 4l9 4-9 4-9-4Z M3 8v9l9 4V12 M21 8v9l-9 4',
  fridge:  'M6 3h12v18H6V3Z M6 10h12 M9 5.5h0 M9 13h0',
  freezer: 'M12 2v20 M5 6l14 12 M19 6 5 18 M6 3l6 3 6-3 M6 21l6-3 6 3',
  home:    'M4 11 12 4l8 7v9h-5v-6H9v6H4v-9Z',
  chat:    'M4 4h16v12H8l-4 4V4Z',
  check:   'M5 12l5 5L19 7',
  history: 'M4 12a8 8 0 1 1 3 6.2 M4 12V7 M4 12h5',
  sync:    'M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3 M18 4v4h-4 M6 20v-4h4',
  robot:   'M9 8V5h6v3 M5 8h14v11H5V8Z M9 13h0 M15 13h0',
  camera:  'M4 8h3l2-3h6l2 3h3v11H4V8Z M12 11a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z',
  send:    'M4 20 20 12 4 4 4 10 15 12 4 14Z',
  search:  'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14Z M20 20l-4.3-4.3',
  plus:    'M12 5v14 M5 12h14',
};
function iconSvg(name, size){
  size = size || 20;
  const d = ICON_PATHS[name] || ICON_PATHS.box;
  return `<span class="icon" style="width:${size}px;height:${size}px"><svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${
    d.split(' M').map((seg,i)=> `<path d="${i===0?seg:'M'+seg}"/>`).join('')
  }</svg></span>`;
}
/* category id -> icon key, used everywhere a product/category needs an icon */
const CAT_ICON = {
  grooming:'droplet', bath_hygiene:'droplet', laundry_home:'shirt',
  food:'cart', coffee:'coffee', medstudy:'book', health:'cross'
};
function catIcon(catId){ return CAT_ICON[catId] || 'box'; }

let S = {
  items:[], spaces:[], cats:[], extras:[], events:[], dismissedInsights:{},
  meta:{ updatedAt:0, schemaVersion:0 }
};
const UI = { tab:'home', space:'all', cat:'all', view:'grid', q:'', zone:'all', shopQ:'' };

/* ---------- helpers ---------- */
const $  = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* CSS text-overflow:ellipsis on a single line of mixed Hebrew/English text
   is where the truncation actually reorders badly — the browser inserts
   the ellipsis into the visual layout after bidi reordering has already
   split a Latin word across the cut, which is exactly the "truncate and
   reorder poorly" symptom. Truncating the STRING itself, in logical order,
   before it ever reaches the DOM sidesteps that: the bidi algorithm then
   only ever has to lay out an already-short, already-correct string. */
function bidiTrunc(s, max){
  s = String(s == null ? '' : s);
  if (s.length <= max) return s;
  const cut = s.slice(0, max).replace(/\s+\S*$/, '');
  return (cut || s.slice(0, max)) + '…';
}

let toastT;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---------- state normalization / migration ----------
   S.meta.schemaVersion tracks the shape of S.items. Runs on every load
   path (localStorage, JSON import, incoming Firebase snapshot) so none
   of them can ever hand the rest of the app a pre-2.0 item shape.
   Uncertain items default to inventoryMode "supply" — that's exactly
   how every item already behaved before this version, so it's a safe
   default, never an aggressive guess. Nothing here can drop an item. */
function migrateState(state){
  state = state || {};
  state.items   = Array.isArray(state.items)   ? state.items   : [];
  state.spaces  = Array.isArray(state.spaces)  ? state.spaces  : [];
  state.cats    = Array.isArray(state.cats)    ? state.cats    : [];
  state.extras  = Array.isArray(state.extras)  ? state.extras  : [];
  state.events  = Array.isArray(state.events)  ? state.events  : [];
  state.dismissedInsights = (state.dismissedInsights && typeof state.dismissedInsights === 'object')
    ? state.dismissedInsights : {};
  state.meta    = state.meta || {};
  if (!state.meta.schemaVersion) state.meta.schemaVersion = 0;

  if (state.meta.schemaVersion < SCHEMA_VERSION){
    state.items = state.items.map(raw => {
      const it = Object.assign({}, raw);
      if (it.inventoryMode !== 'supply' && it.inventoryMode !== 'kitchen'){
        it.inventoryMode = KITCHEN_CAT_IDS.has(it.catId) ? 'kitchen' : 'supply';
      }
      if (it.inventoryMode !== 'kitchen') it.kitchenZone = null;
      else if (!ZONES.includes(it.kitchenZone)) it.kitchenZone = 'pantry';
      if (it.familyId === undefined)    it.familyId = null;
      if (it.familyName === undefined)  it.familyName = '';
      if (it.variantName === undefined) it.variantName = '';
      return it;
    });
    state.meta.schemaVersion = SCHEMA_VERSION;
  }
  return state;
}

/* ---------- persistence ---------- */
function save(push = true){
  S.meta.updatedAt = Date.now();
  if (S.events.length > MAX_EVENTS) S.events = S.events.slice(-MAX_EVENTS);
  try { localStorage.setItem(LS_DATA, JSON.stringify(S)); }
  catch(e){ toast('אחסון מקומי מלא'); }
  if (push) pushRemote();
  render();
}

function load(){
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(LS_DATA) || 'null'); } catch(e){}
  if (raw && Array.isArray(raw.items)) {
    S = Object.assign({items:[],spaces:[],cats:[],extras:[],events:[],dismissedInsights:{},meta:{updatedAt:0,schemaVersion:0}}, raw);
  }
  S = migrateState(S);
  if (!S.spaces.length) S.spaces = DEFAULT_SPACES.map(x=>({...x}));
  if (!S.cats.length)   S.cats   = DEFAULT_CATS.map(x=>({...x}));
}

/* every quantity change is recorded — inventory is reconstructable */
function logEvent(type, itemId, delta, note){
  S.events.push({ id:uid(), ts:Date.now(), type, itemId, delta:delta||0, note:note||'' });
}

/* ---------- derived selectors (single source of truth for filtering) ---------- */
const spaceOf = id => S.spaces.find(s=>s.id===id);
const catOf   = id => S.cats.find(c=>c.id===id) || {name:'ללא קטגוריה', emoji:'📦'};

function getSupplyItems(){ return S.items.filter(i => i.inventoryMode !== 'kitchen'); }
function getKitchenItems(){ return S.items.filter(i => i.inventoryMode === 'kitchen'); }
function getKitchenItemsByZone(zone){
  const k = getKitchenItems();
  return (zone && zone !== 'all') ? k.filter(i => (i.kitchenZone||'pantry') === zone) : k;
}
/* target - qty per item, optionally scoped to a pool (defaults to everything) */
function shortages(pool){
  return (pool || S.items)
    .map(it => ({ item:it, need: Math.max(0, (Number(it.target)||0) - (Number(it.qty)||0)) }))
    .filter(x => x.need > 0)
    .sort((a,b)=> (a.item.qty - b.item.qty) || b.need - a.need);
}
function getShoppingNeeds(){ return shortages(); }

/* ---------- deterministic event intelligence ----------
   No AI involved: reads only S.items/S.events, both already-real recorded
   facts. Every insight's "evidence" string states nothing beyond what was
   actually counted, so it can never be a guess or an invented number.
   Conservative on purpose: needs a real, recent pattern (several USED
   events in the window) AND genuinely thin remaining stock, and skips
   anything the deterministic shortages() list already flags or that the
   user already added to the shopping list or dismissed recently. */
const INSIGHT_WINDOW_MS = 14 * 24 * 3600 * 1000;
const INSIGHT_MIN_USES = 3;
const INSIGHT_MAX_QTY = 2;
const INSIGHT_COOLDOWN_MS = 3 * 24 * 3600 * 1000;

function computeInsights(){
  const now = Date.now();
  const cutoff = now - INSIGHT_WINDOW_MS;
  const dismissed = S.dismissedInsights || {};
  const alreadyExtra = new Set(S.extras.filter(e => e.itemId).map(e => e.itemId));

  const insights = [];
  S.items.forEach(it => {
    const qty = Number(it.qty) || 0;
    if (qty > INSIGHT_MAX_QTY) return;
    if (qty < (Number(it.target) || 0)) return; // shortages() already covers this item
    if (alreadyExtra.has(it.id)) return;

    const uses = S.events.filter(e => e.itemId === it.id && e.type === 'USED' && e.ts >= cutoff);
    if (uses.length < INSIGHT_MIN_USES) return;

    const id = 'freq_' + it.id;
    const lastDismissed = dismissed[id] || 0;
    if (now - lastDismissed < INSIGHT_COOLDOWN_MS) return;

    const days = Math.max(1, Math.round((now - cutoff) / 86400000));
    insights.push({
      id, itemId: it.id, type: 'frequent_use',
      evidence: `נעשה בו שימוש ${uses.length} פעמים ב-${days} הימים האחרונים · נשארו ${qty}`
    });
  });
  return insights.sort((a, b) => a.evidence.localeCompare(b.evidence));
}

function dismissInsight(id){
  S.dismissedInsights = S.dismissedInsights || {};
  S.dismissedInsights[id] = Date.now();
  save(false);
}

function getNeedsAttention(){
  return S.items
    .filter(i => (Number(i.qty)||0) === 0 || (Number(i.qty)||0) < (Number(i.target)||0))
    .sort((a,b)=> (Number(a.qty)||0) - (Number(b.qty)||0));
}
/* items sharing a familyId, grouped for display — a presentation layer
   only; membership is opt-in (see openItem) and never auto-merges records */
function getFamilies(){
  const map = new Map();
  S.items.forEach(it => {
    if (!it.familyId) return;
    if (!map.has(it.familyId)) map.set(it.familyId, { id: it.familyId, name: it.familyName || it.name, items: [] });
    map.get(it.familyId).items.push(it);
  });
  return [...map.values()];
}
function householdStatus(){
  const total = S.items.length;
  if (!total) return { pct:100, needing:0 };
  const ok = S.items.filter(i => (Number(i.qty)||0) >= (Number(i.target)||0)).length;
  return { pct: Math.round(ok/total*100), needing: total - ok };
}

function photoSrc(it){ return it.photo || it.photoUrl || ''; }

function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('קריאת הקובץ נכשלה'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('לא ניתן לקרוא את התמונה'));
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* Space color is now only used as a small wayfinding dot in the Supplies
   filter chips (not on every card — the redesign asked for less color at
   once). Fixed palette, hashed by space id, so it's stable across renders. */
const SPACE_PALETTE = ['#4FA89C','#C1683E','#8177B8','#5F84A6','#B8935F','#7C9473'];
function spaceColor(spaceId){
  if (!spaceId) return null;
  let h = 0;
  for (let i = 0; i < spaceId.length; i++) h = (h * 31 + spaceId.charCodeAt(i)) >>> 0;
  return SPACE_PALETTE[h % SPACE_PALETTE.length];
}

function stepperHTML(it){
  const q = Number(it.qty)||0;
  return `<div class="stepper">
    <button data-q="${it.id}" data-d="-1">−</button>
    <span class="n ${q===0?'z':''}">${q}</span>
    <button data-q="${it.id}" data-d="1">+</button></div>`;
}

function pcardHTML(it){
  const q = Number(it.qty)||0, t = Number(it.target)||1;
  const tag = q===0 ? `<span class="status-tag out">אזל</span>`
            : q<t   ? `<span class="status-tag low">חסר ${t-q}</span>` : '';
  const src = photoSrc(it);
  return `<div class="pcard ${q===0?'out':''}">
    ${src ? `<img class="thumb" src="${esc(src)}" alt="">` : `<div class="swatch">${iconSvg(catIcon(it.catId),20)}</div>`}
    <div class="info" data-edit="${it.id}">
      <div class="name trunc">${esc(bidiTrunc(it.name,26))}</div>
      <div class="sub trunc">${esc(bidiTrunc(it.brand||catOf(it.catId).name,26))}</div>
      ${tag}
    </div>
    ${stepperHTML(it)}
  </div>`;
}

function familyCardHTML(fid, arr){
  const totalQty = arr.reduce((a,i)=>a+(Number(i.qty)||0),0);
  const name = arr[0].familyName || arr[0].name;
  const anyOut = arr.some(i=>!Number(i.qty));
  const anyLow = !anyOut && arr.some(i=> Number(i.qty)>0 && Number(i.qty) < (Number(i.target)||1));
  const tag = anyOut ? `<span class="status-tag out">חלק אזל</span>`
            : anyLow ? `<span class="status-tag low">לקראת סוף</span>` : '';
  return `<button class="pcard" data-fam="${esc(fid)}" style="text-align:right">
    <div class="swatch">${iconSvg(catIcon(arr[0].catId),20)}</div>
    <div class="info">
      <div class="name trunc">${esc(bidiTrunc(name,26))}</div>
      <div class="sub trunc">${totalQty} יחידות · ${arr.length} גרסאות</div>
      ${tag}
    </div>
  </button>`;
}

function openFamily(fid){
  const items = S.items.filter(i=>i.familyId===fid);
  if (!items.length) return;
  const name = items[0].familyName || items[0].name;
  sheet(`
    <h2 class="bidi">${esc(name)}</h2>
    <p class="muted" style="margin-bottom:10px">${items.length} גרסאות · לשינוי שיוך משפחה, ערוך כל מוצר בנפרד</p>
    <div class="plist">${items.map(it=>pcardHTML(it)).join('')}</div>
    <button class="btn g" id="famClose" style="margin-top:14px">סגירה</button>
  `, () => { $('famClose').onclick = closeSheet; });
}

/* ---------- render dispatch ---------- */
const TAB_TITLES = { home:'Home OS', supplies:'מצרכים', kitchen:'מטבח', shopping:'קניות' };

/* render() replaces #view's entire innerHTML, which — if left alone —
   destroys and recreates whatever <input> the user is typing into on every
   single keystroke (the "keyboard collapse" bug: a brand-new DOM node has
   no focus, no selection, and drops the on-screen keyboard on mobile).
   Snapshotting focus/selection before the replace and restoring it after
   fixes every current and future text field inside #view without having
   to move to a partial-DOM-patch renderer. */
function render(){
  $('tabTitle').textContent = TAB_TITLES[UI.tab] || 'Home OS';
  document.querySelectorAll('.tabbar button[data-tab]').forEach(b =>
    b.classList.toggle('on', b.dataset.tab === UI.tab));
  const el = $('view');

  const active = document.activeElement;
  let focusState = null;
  if (active && el.contains(active) && active.id){
    focusState = {
      id: active.id,
      selStart: (typeof active.selectionStart === 'number') ? active.selectionStart : null,
      selEnd:   (typeof active.selectionEnd === 'number') ? active.selectionEnd : null,
      scrollTop: el.scrollTop
    };
  }

  if (UI.tab === 'supplies')      el.innerHTML = renderSupplies();
  else if (UI.tab === 'kitchen')  el.innerHTML = renderKitchen();
  else if (UI.tab === 'shopping') el.innerHTML = renderShoppingTab();
  else                            el.innerHTML = renderHome();
  wireTabExtras();

  if (focusState){
    const revived = $(focusState.id);
    if (revived && (revived.tagName === 'INPUT' || revived.tagName === 'TEXTAREA')){
      revived.focus({preventScroll:true});
      if (focusState.selStart !== null){
        try { revived.setSelectionRange(focusState.selStart, focusState.selEnd); } catch(e){}
      }
    }
    el.scrollTop = focusState.scrollTop;
  }
}

/* elements that live inside #view get replaced on every render(), so their
   handlers must be rebound every time — delegated clicks (data-*) don't
   need this, only direct bindings like oninput/onkeydown do. */
function wireTabExtras(){
  if (UI.tab === 'supplies'){
    if ($('supQ')) $('supQ').oninput = e => { UI.q = e.target.value; render(); };
    if ($('openAddSupply')) $('openAddSupply').onclick = () => openItem(null, {inventoryMode:'supply'});
  }
  if (UI.tab === 'kitchen'){
    if ($('kitQ')) $('kitQ').oninput = e => { UI.q = e.target.value; render(); };
    if ($('openAddKitchen')) $('openAddKitchen').onclick = () =>
      openItem(null, {inventoryMode:'kitchen', kitchenZone: UI.zone!=='all' ? UI.zone : 'pantry'});
  }
  if (UI.tab === 'shopping'){
    if ($('shopNew')){
      $('shopNew').oninput = e => { UI.shopQ = e.target.value; render(); };
      $('shopNew').onkeydown = e => { if (e.key==='Enter'){ e.preventDefault(); commitShopAdd(); } };
    }
    if ($('shopAdd')) $('shopAdd').onclick = () => commitShopAdd();
    if ($('shopWa')) $('shopWa').onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent(shopText()), '_blank');
    if ($('shopCp')) $('shopCp').onclick = async () => {
      try { await navigator.clipboard.writeText(shopText()); toast('הועתק'); }
      catch(e){ toast('ההעתקה נחסמה בדפדפן'); }
    };
    if ($('shopDone')) $('shopDone').onclick = () => {
      let n = 0;
      getShoppingNeeds().forEach(({item,need}) => {
        if (!item._got) return;
        item.qty = (Number(item.qty)||0) + need;
        logEvent('PURCHASE', item.id, need, 'קנייה מהרשימה');
        delete item._got; n++;
      });
      S.extras.filter(e=>e.got).forEach(e=>{
        if (!e.itemId) return;
        const it = S.items.find(i=>i.id===e.itemId);
        if (!it) return;
        const qty = Math.max(1, Number(e.qty)||1);
        it.qty = (Number(it.qty)||0) + qty;
        logEvent('PURCHASE', it.id, qty, 'קנייה מרשימת קניות');
        n++;
      });
      S.extras = S.extras.filter(e=>!e.got);
      save();
      toast(n ? `${n} מוצרים עודכנו` : 'לא סומן כלום');
    };
  }
}

/* ---------- Home dashboard ----------
   Status first, raw counts never — "92% במלאי", not "29 מוצרים / 78 יחידות".
   Only a handful of the most urgent items get their own card below it. */
function renderHome(){
  const supply = getSupplyItems(), kitchen = getKitchenItems();
  const supplyNeed = shortages(supply).length;
  const kitchenNeed = shortages(kitchen).length;
  const shopCount = getShoppingNeeds().length + S.extras.filter(e=>!e.got).length;
  const stat = householdStatus();
  const attention = getNeedsAttention().slice(0, 5);
  const insights = computeInsights().slice(0, 2);

  return `
    <div class="hero row">
      <div class="hero-ring" style="background:conic-gradient(var(--success) ${stat.pct*3.6}deg, var(--surface-2) 0deg)"></div>
      <div class="grow">
        <div class="hero-title">מצב הבית</div>
        <div class="hero-value">${stat.pct}% במלאי</div>
        <div class="muted">${stat.needing ? `${stat.needing} מוצרים דורשים תשומת לב` : 'הכל תקין'}</div>
      </div>
    </div>

    <div class="dash-grid">
      <button class="dash-card" data-tab="supplies" style="text-align:right">
        <div class="ic">${iconSvg('bottle',20)}</div>
        <div class="lbl">מצרכים</div>
        <div class="sub">${supplyNeed ? `${supplyNeed} דורשים חידוש` : 'הכל תקין'}</div>
      </button>
      <button class="dash-card" data-tab="kitchen" style="text-align:right">
        <div class="ic">${iconSvg('fridge',20)}</div>
        <div class="lbl">מטבח</div>
        <div class="sub">${kitchenNeed ? `${kitchenNeed} דורשים תשומת לב` : 'הכל תקין'}</div>
      </button>
      <button class="dash-card" data-tab="shopping" style="grid-column:1 / -1;text-align:right">
        <div class="row">
          <div class="ic">${iconSvg('cart',20)}</div>
          <div class="grow">
            <div class="lbl">קניות</div>
            <div class="sub">${shopCount ? `${shopCount} פריטים ברשימה` : 'הרשימה ריקה'}</div>
          </div>
        </div>
      </button>
    </div>

    ${insights.length ? `
      <div class="section-title">Home OS שם לב</div>
      ${insights.map(ins => noticedCardHTML(ins)).join('')}
    ` : ''}

    ${attention.length ? `
      <div class="section-title">צריך תשומת לב</div>
      ${attention.map(it => attnCardHTML(it)).join('')}
    ` : ''}
  `;
}

/* proactive suggestion cards on Home — same computeInsights() evidence as
   Shopping's "Home OS מציע" section, just surfaced earlier and capped to
   the top 2 so the dashboard stays calm rather than alarm-heavy */
function noticedCardHTML(ins){
  const it = S.items.find(i => i.id === ins.itemId);
  if (!it) return '';
  return `<div class="attn-card" style="align-items:flex-start">
    <div class="ic" style="width:34px;height:34px;flex-shrink:0">${iconSvg('robot',16)}</div>
    <div class="grow">
      <div style="font-weight:600;font-size:13.5px" class="bidi">${esc(it.name)}</div>
      <div class="muted bidi" style="margin-bottom:8px">${esc(ins.evidence)}</div>
      <div class="row" style="gap:8px">
        <button class="chip on" data-insight-accept="${esc(ins.id)}" style="padding:5px 12px">הוסף לרשימה</button>
        <button class="chip" data-insight-dismiss="${esc(ins.id)}" style="padding:5px 12px">התעלם</button>
      </div>

function attnCardHTML(it){

/* ---------- Supplies (Phase 5) ---------- */
function renderSupplies(){
  const q = UI.q.trim().toLowerCase();
  const all = getSupplyItems();
  const filtered = all.filter(it => {
    if (UI.space !== 'all' && it.spaceId !== UI.space) return false;
    if (UI.cat   !== 'all' && it.catId   !== UI.cat)   return false;
    if (!q) return true;
    return (it.name||'').toLowerCase().includes(q) || (it.brand||'').toLowerCase().includes(q);
  });

  const families = new Map();
  const solo = [];
  filtered.forEach(it => {
    if (it.familyId){
      if (!families.has(it.familyId)) families.set(it.familyId, []);
      families.get(it.familyId).push(it);
    } else solo.push(it);
  });

  const below = shortages(all).length;
  const spaceChips = ['all', ...S.spaces.map(s=>s.id)].map(id=>{
    const s = id==='all' ? {name:'הכל'} : spaceOf(id);
    if (!s) return '';
    const col = id==='all' ? null : spaceColor(id);
    const dot = col ? `<span style="width:7px;height:7px;border-radius:50%;background:${col};flex-shrink:0"></span>` : '';
    const n = id==='all' ? all.length : all.filter(i=>i.spaceId===id).length;
    if (id!=='all' && !n) return '';
    return `<button class="chip ${UI.space===id?'on':''}" data-sp="${esc(id)}">${dot}${esc(s.name)} <span style="opacity:.6">${n}</span></button>`;
  }).join('');

  return `
    <div class="row" style="margin-bottom:10px">
      <div class="grow muted">${all.length} מוצרים${below?` · ${below} מתחת ליעד`:''}</div>
      <button class="iconbtn on" id="openAddSupply">${iconSvg('plus',15)}</button>
    </div>
    <div class="search" style="margin-bottom:10px">
      <input id="supQ" dir="auto" placeholder="חיפוש מוצר או מותג…" value="${esc(UI.q)}">
      <span>${iconSvg('search',14)}</span>
    </div>
    <div class="scroll-x" style="margin-bottom:12px">${spaceChips}</div>

    <div class="plist">
      ${[...families.entries()].map(([fid, arr]) => familyCardHTML(fid, arr)).join('')}
      ${solo.map(it => pcardHTML(it)).join('')}
    </div>
    ${!filtered.length ? `<div class="empty"><div class="icon" style="justify-content:center">${iconSvg('bottle',34)}</div><div>לא נמצאו מוצרים</div></div>` : ''}

function kitchenCardHTML(it){

/* ---------- Shopping (Phase 7) ----------
   Still derived state (target - qty) plus manual extras — no separate
   shopping database. Bucketed by urgency: kitchen needs are inherently
   "this week"; out-of-stock supply items are "soon"; supply items that
   are merely below target (but not zero) can wait for a bigger restock. */
function renderShoppingTab(){
  const needs = getShoppingNeeds();
  const kitchenNeeds = needs.filter(n => n.item.inventoryMode === 'kitchen');
  const supplyNeeds  = needs.filter(n => n.item.inventoryMode !== 'kitchen');
  const outNow  = supplyNeeds.filter(n => Number(n.item.qty) === 0);
  const lowSoon = supplyNeeds.filter(n => Number(n.item.qty) > 0);
  const extras = S.extras;
  const insights = computeInsights();
  const empty = !needs.length && !extras.length;

  function bucket(title, list){
    if (!list.length) return '';
    return `<div class="shop-bucket">
      <div class="section-title">${title}</div>
      <div class="group">${list.map(n => shopItemHTML(n)).join('')}</div>
    </div>`;
  }

  const matches = shoppingMatches(UI.shopQ);
  const suggestHTML = UI.shopQ.trim() ? `<div class="group" id="shopSuggest" style="margin-bottom:12px">
    ${matches.length ? matches.map(it => `
      <div class="shop-item" data-shopsuggest="${esc(it.id)}" style="cursor:pointer">
        <div class="ic" style="width:28px;height:28px;flex-shrink:0">${iconSvg(catIcon(it.catId),14)}</div>
        <div class="grow">
          <div class="bidi" style="font-weight:600;font-size:13.5px">${esc(bidiTrunc(it.name,40))}</div>

      </div>`).join('')
      : `<div class="shop-item"><div class="muted grow">אין מוצר קיים תואם — הקשה על + להוספה כפריט חדש</div></div>`}
  </div>` : '';

  const smartHTML = insights.length ? `<div class="shop-bucket">
    <div class="section-title">Home OS מציע</div>
    <div class="group">${insights.map(ins => {
      const it = S.items.find(i => i.id === ins.itemId);
      if (!it) return '';
      return `<div class="shop-item" style="align-items:flex-start">
        <div class="ic" style="width:28px;height:28px;flex-shrink:0">${iconSvg('robot',14)}</div>
        <div class="grow">
          <div class="bidi" style="font-weight:600;font-size:13.5px">${esc(bidiTrunc(it.name,40))}</div>
          <div class="muted bidi">${esc(ins.evidence)}</div>
        </div>
        <div class="row" style="gap:6px;flex-shrink:0">
          <button class="chip on" data-insight-accept="${esc(ins.id)}" style="padding:4px 10px;font-size:11.5px">הוסף</button>
          <button class="chip" data-insight-dismiss="${esc(ins.id)}" style="padding:4px 10px;font-size:11.5px">התעלם</button>
        </div>
      </div>`;
    }).join('')}</div>
  </div>` : '';

  const extrasHTML = extras.length ? `<div class="shop-bucket">
    <div class="section-title">נוסף לרשימה</div>
    <div class="group">${extras.map(e=>{
      const linked = e.itemId ? S.items.find(i=>i.id===e.itemId) : null;
      const label = linked ? linked.name : e.text;
      const sub = linked ? (linked.brand || '') : '';
      return `
      <div class="shop-item">
        <div class="tick ${e.got?'on':''}" data-xgot="${e.id}">✓</div>
        <div class="grow" style="${e.got?'opacity:.45;text-decoration:line-through':''}">
          <div class="bidi" style="font-weight:600;font-size:13.5px">${esc(bidiTrunc(label,40))}</div>
          ${sub ? `<div class="muted bidi">${esc(bidiTrunc(sub,40))}</div>` : ''}
        </div>
        <button class="iconbtn" style="width:26px;height:26px;background:transparent" data-xdel="${e.id}">✕</button>
      </div>`;
    }).join('')}</div>
  </div>` : '';

  return `
    <div class="row" style="margin-bottom:10px">
      <input id="shopNew" class="grow" dir="auto" autocomplete="off" placeholder="חפש מוצר קיים או הוסף פריט חדש…" value="${esc(UI.shopQ)}">
      <button class="iconbtn on" id="shopAdd">${iconSvg('plus',16)}</button>
    </div>
    ${suggestHTML}
    ${smartHTML}
    ${empty ? `<div class="empty"><div class="icon" style="justify-content:center">${iconSvg('check',34)}</div><div>אין מה לקנות</div></div>` : ''}
    ${bucket('השבוע', kitchenNeeds)}
    ${bucket('בקרוב', outNow)}
    ${bucket('מלאי סמסטריאלי', lowSoon)}
    ${extrasHTML}
    ${!empty ? `
      <button class="btn a" id="shopWa" style="margin-top:6px">שליחה לוואטסאפ</button>
      <button class="btn g" id="shopCp" style="margin-top:8px">העתקה כטקסט</button>
      <button class="btn g" id="shopDone" style="margin-top:8px">סמן מסומנים כנקנו והפחת חוסרים</button>

function shopItemHTML(n){
  const item = n.item;
  return `<div class="shop-item">
    <div class="tick ${item._got?'on':''}" data-need="${item.id}">✓</div>
    <div class="grow" style="${item._got?'opacity:.45;text-decoration:line-through':''}">
      <div class="bidi" style="font-weight:600;font-size:13.5px">${esc(bidiTrunc(item.name,40))}</div>
      <div class="muted bidi">${esc(bidiTrunc(item.brand||'',40))}${item.note?' · '+esc(bidiTrunc(item.note,40)):''}</div>
    </div>
    <span class="need">×${n.need}</span>

}

function shopText(){
  const sh = getShoppingNeeds();
  let t = '🛒 רשימת קניות — Home OS\n';
  const byCat = {};
  sh.forEach(({item,need}) => (byCat[item.catId] = byCat[item.catId]||[]).push({item,need}));
  Object.entries(byCat).forEach(([cid, arr]) => {
    const c = catOf(cid);
    t += `\n${c.name}\n`;
    arr.forEach(({item,need}) => {
      t += `• ${item.name}${item.brand?' ('+item.brand+')':''} ×${need}\n`;
    });
  });
  const ex = S.extras.filter(e=>!e.got);
  if (ex.length){
    t += `\nנוסף לרשימה\n`;
    ex.forEach(e => {
      const it = e.itemId ? S.items.find(i=>i.id===e.itemId) : null;
      t += `• ${it ? it.name : e.text}\n`;
    });
  }
  return t.trim() || 'הרשימה ריקה';
}

/* ---------- Shopping Smart Add ----------
   Typing into the shopping field searches the household's own catalog
   first — tapping a match adds a reference to that real item (so its
   brand/stock stay attached) instead of a disconnected line of text.
   Only when nothing in the catalog matches does it fall back to a plain
   manual entry, exactly per the release priority: existing items before
   manual extras. */
function shoppingMatches(q){
  q = (q || '').trim().toLowerCase();
  if (!q) return [];
  const alreadyListed = new Set([
    ...getShoppingNeeds().map(n => n.item.id),
    ...S.extras.filter(e => e.itemId).map(e => e.itemId)
  ]);
  return S.items
    .filter(it => !alreadyListed.has(it.id))
    .filter(it => (it.name||'').toLowerCase().includes(q) || (it.brand||'').toLowerCase().includes(q))
    .slice(0, 5);
}

function addShoppingItemRef(itemId){
  const it = S.items.find(i => i.id === itemId);
  if (!it) return;
  const alreadyShort = getShoppingNeeds().some(n => n.item.id === itemId);
  const alreadyExtra = S.extras.some(e => e.itemId === itemId);
  if (alreadyShort || alreadyExtra){ toast('כבר ברשימת הקניות'); return; }
  S.extras.push({id:uid(), itemId, text:it.name, got:false, qty:1});
  save(false);
  toast(`"${it.name}" נוסף לרשימה`);
}

function commitShopAdd(pickedItemId){
  if (pickedItemId){ addShoppingItemRef(pickedItemId); UI.shopQ = ''; render(); return; }
  const text = (UI.shopQ || '').trim();
  if (!text) return;
  const q = text.toLowerCase();
  const exact = S.items.find(it =>
    (it.name||'').toLowerCase() === q || (it.brand && `${it.brand} ${it.name}`.toLowerCase() === q));
  if (exact){ addShoppingItemRef(exact.id); }
  else { S.extras.push({id:uid(), text, got:false}); save(false); }
  UI.shopQ = '';
  render();
}

/* ---------- item CRUD ---------- */
function suggestFamilyName(name, brand){
  brand = (brand||'').trim();
  if (!brand) return '';
  const fams = getFamilies();
  for (const f of fams){
    const rep = f.items[0];
    if (rep.brand && rep.brand.toLowerCase().trim() === brand.toLowerCase()) return f.name;
  }
  return '';
}

function openItem(id, defaults){
  const it = id ? S.items.find(i=>i.id===id) : null;
  defaults = defaults || {};
  let pendingPhoto = it ? (it.photo || it.photoUrl || '') : '';
  let mode = it ? (it.inventoryMode||'supply') : (defaults.inventoryMode||'supply');
  const spOpts = S.spaces.map(s=>`<option value="${esc(s.id)}" ${(it?it.spaceId:defaults.spaceId)===s.id?'selected':''}>${esc(s.name)}</option>`).join('');
  const ctOpts = S.cats.map(c=>`<option value="${esc(c.id)}" ${(it?it.catId:defaults.catId)===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  const zoneVal = it ? (it.kitchenZone||'pantry') : (defaults.kitchenZone||'pantry');
  const famNames = [...new Set(getFamilies().map(f=>f.name))];

  sheet(`
    <h2>${it ? 'עריכת מוצר' : 'מוצר חדש'}</h2>

    <div class="two" style="margin-bottom:11px">
      <button type="button" class="btn ${mode==='supply'?'a':'g'}" id="modeSupply">מצרכים</button>
      <button type="button" class="btn ${mode==='kitchen'?'a':'g'}" id="modeKitchen">מטבח</button>
    </div>
    <div class="field" id="zoneField" style="${mode==='kitchen'?'':'display:none'}">
      <label>אזור</label>
      <select id="fZone">${ZONES.map(z=>`<option value="${z}" ${zoneVal===z?'selected':''}>${esc(ZONE_LABEL[z])}</option>`).join('')}</select>
    </div>

    <div id="photoPreviewWrap" style="margin-bottom:10px"></div>
    <div class="two" style="margin-bottom:10px">
      <button type="button" class="btn g" id="photoCamBtn">📷 צלם</button>
      <button type="button" class="btn g" id="photoGalBtn">🖼️ מהגלריה</button>
    </div>
    <input type="file" accept="image/*" capture="environment" id="fPhotoCam" class="hidden">
    <input type="file" accept="image/*" id="fPhotoGal" class="hidden">

    <div class="field"><label>שם המוצר *</label><input id="fName" dir="auto" value="${it?esc(it.name):''}" placeholder="למשל: שמפו"></div>
    <div class="field"><label>מותג</label><input id="fBrand" dir="auto" value="${it?esc(it.brand||''):''}" placeholder="למשל: Hawaii"></div>
    <div class="field">
      <label>משפחת מוצר (רשות)</label>
      <input id="fFamily" dir="auto" list="famList" value="${it?esc(it.familyName||''):''}" placeholder="למשל: AXE דאודורנט">
      <datalist id="famList">${famNames.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      <div class="muted" id="famHint" style="margin-top:4px"></div>
    </div>
    <div class="two">
      <div class="field"><label>חלל</label><select id="fSpace">${spOpts}</select></div>
      <div class="field"><label>קטגוריה</label><select id="fCat">${ctOpts}</select></div>
    </div>
    <div class="two">
      <div class="field"><label>כמות נוכחית</label><input id="fQty" type="number" inputmode="numeric" min="0" value="${it?(Number(it.qty)||0):1}"></div>
      <div class="field"><label>כמות יעד</label><input id="fTarget" type="number" inputmode="numeric" min="0" value="${it?(Number(it.target)||1):1}"></div>
    </div>
    <div class="field"><label>הערה</label><input id="fNote" dir="auto" value="${it?esc(it.note||''):''}" placeholder="גודל, חנות מועדפת, מחיר…"></div>
    <button class="btn a" id="fSave" style="margin-top:4px">שמירה</button>
    ${it?`<button class="btn r" id="fDel" style="margin-top:8px">מחיקת המוצר</button>`:''}
    <button class="btn g" id="fCancel" style="margin-top:8px">ביטול</button>
  `, () => {
    $('modeSupply').onclick = () => {
      mode = 'supply'; $('modeSupply').className = 'btn a'; $('modeKitchen').className = 'btn g';
      $('zoneField').style.display = 'none';
    };
    $('modeKitchen').onclick = () => {
      mode = 'kitchen'; $('modeKitchen').className = 'btn a'; $('modeSupply').className = 'btn g';
      $('zoneField').style.display = '';
    };

    function paintPhoto(){
      $('photoPreviewWrap').innerHTML = pendingPhoto
        ? `<div style="position:relative"><img class="photo-box" src="${esc(pendingPhoto)}" alt="">
             <button type="button" id="photoRemove" class="iconbtn" style="position:absolute;top:6px;left:6px;background:rgba(17,24,39,.55);color:#fff">✕</button></div>`
        : `<div class="photo-empty">אין תמונה</div>`;
      if ($('photoRemove')) $('photoRemove').onclick = () => { pendingPhoto = ''; paintPhoto(); };
    }
    paintPhoto();

    $('photoCamBtn').onclick = () => $('fPhotoCam').click();
    $('photoGalBtn').onclick = () => $('fPhotoGal').click();
    async function handlePhotoFile(e){
      const file = e.target.files[0]; e.target.value = '';
      if (!file) return;
      try { pendingPhoto = await compressImageFile(file, 640, 0.65); paintPhoto(); }
      catch(err){ toast(err.message); }
    }
    $('fPhotoCam').onchange = handlePhotoFile;
    $('fPhotoGal').onchange = handlePhotoFile;

    $('fBrand').addEventListener('blur', () => {
      if ($('fFamily').value.trim()) return;
      const sug = suggestFamilyName($('fName').value, $('fBrand').value);
      $('famHint').innerHTML = sug
        ? `💡 קיימת משפחה "${esc(sug)}" לאותו מותג — <button type="button" id="famApply" style="color:var(--accent);text-decoration:underline">השתמש</button>`
        : '';
      if ($('famApply')) $('famApply').onclick = () => { $('fFamily').value = sug; $('famHint').innerHTML = ''; };
    });

    $('fCancel').onclick = closeSheet;
    $('fSave').onclick = () => {
      const name = $('fName').value.trim();
      if (!name) return toast('חסר שם מוצר');
      const tRaw = $('fTarget').value.trim();
      const photoChanged = pendingPhoto !== (it ? (it.photo || it.photoUrl || '') : '');
      const famNameInput = $('fFamily').value.trim();

      const data = {
        name, brand:$('fBrand').value.trim(),
        spaceId:$('fSpace').value, catId:$('fCat').value,
        qty:Math.max(0, parseInt($('fQty').value)||0),
        // blank target keeps the previous value instead of silently becoming 0
        target: tRaw === '' ? (it ? Number(it.target)||0 : 1) : Math.max(0, parseInt(tRaw)||0),
        note:$('fNote').value.trim(),
        inventoryMode: mode,
        kitchenZone: mode==='kitchen' ? $('fZone').value : null,
      };

      // family: match an existing family by exact name, else create a new
      // one — never silently merges this item into an unrelated family
      if (famNameInput){
        const existingFam = getFamilies().find(f => f.name.toLowerCase() === famNameInput.toLowerCase());
        if (existingFam){ data.familyId = existingFam.id; data.familyName = existingFam.name; }
        else { data.familyId = (it && it.familyId) ? it.familyId : uid(); data.familyName = famNameInput; }
      } else {
        data.familyId = null; data.familyName = '';
      }

      if (photoChanged){
        data.photo = pendingPhoto;
        if (!pendingPhoto) data.photoUrl = '';
      }
      let targetItem;
      if (it){
        if (it.qty !== data.qty) logEvent('CORRECTION', it.id, data.qty - it.qty, 'עריכה ידנית');
        Object.assign(it, data);
        targetItem = it;
      } else {
        const n = {id:uid(), ...data, createdAt:Date.now()};
        S.items.push(n);
        logEvent('PURCHASE', n.id, data.qty, 'מוצר חדש');
        targetItem = n;
      }
      closeSheet(); save(); toast(it?'המוצר עודכן':'המוצר נוסף');
      if (photoChanged && pendingPhoto) uploadItemPhoto(targetItem, pendingPhoto);
    };
    if (it) $('fDel').onclick = () => {
      if (!confirm(`למחוק את "${it.name}"?`)) return;
      S.items = S.items.filter(x=>x.id!==it.id);
      logEvent('DELETE', it.id, -(Number(it.qty)||0), it.name);
      closeSheet(); save(); toast('נמחק');
    };
    setTimeout(()=>{ const f=$('fName'); if (f) f.focus(); }, 60);
  });
}

/* imports pass through the exact same migrateState() as local load and
   Firebase snapshots — a backup from before schema v2 loads in safely */
function importJSON(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const p = JSON.parse(ev.target.result);
      const items = p.items || (Array.isArray(p) ? p : null);
      if (!Array.isArray(items)) return toast('קובץ לא תקין');
      if (S.items.length && !confirm(`לייבא ${items.length} מוצרים ולהחליף את ${S.items.length} הקיימים?`)) return;

      let incoming = {
        items: items.map(i => ({
          id:i.id||uid(), name:i.name||'ללא שם', brand:i.brand||'',
          spaceId:i.spaceId||'bathroom', catId:i.catId||i.categoryId||'grooming',
          qty:Number(i.qty)||0, target:Number(i.target)|| (Number(i.qty)||1), note:i.note||'',
          photo:i.photo||'', photoUrl:i.photoUrl||'', createdAt:i.createdAt||Date.now(),
          inventoryMode:i.inventoryMode, kitchenZone:i.kitchenZone,
          familyId:i.familyId, familyName:i.familyName, variantName:i.variantName
        })),
        spaces: (p.spaces && p.spaces.length) ? p.spaces.filter(x=>x.id!=='all').map(x=>({id:x.id,name:x.name,emoji:x.emoji||'📦'})) : S.spaces,
        cats:   (p.cats||p.categories) ? (p.cats||p.categories).filter(x=>x.id!=='all').map(x=>({id:x.id,name:x.name,emoji:x.emoji||'📦'})) : S.cats,
        extras: p.extras || [],
        events: p.events || [],
        meta:   p.meta || {}
      };
      incoming = migrateState(incoming);
      S.items = incoming.items; S.spaces = incoming.spaces; S.cats = incoming.cats;
      S.extras = incoming.extras; S.events = incoming.events; S.meta = incoming.meta;
      closeSheet(); save(); toast(`${S.items.length} מוצרים יובאו`);
    } catch(err){ toast('שגיאה בקריאת הקובץ'); }
  };
  r.readAsText(f); e.target.value = '';
}

/* ---------- Firebase (lazy, optional) ----------
   Firestore documents are capped around 1MB, so base64 photos never go
   into the synced doc — only the local copy. When Storage is wired up,
   uploadItemPhoto() pushes the actual bytes there and only a short URL
   string rides along in the synced document. */
let fb = null, remoteWrite = null, syncing = false;

function setSync(state, txt){
  $('syncDot').className = 'dot' + (state==='on'?' on':state==='err'?' err':'');
  $('syncTxt').textContent = txt;
}

async function initFirebase(){
  const raw = localStorage.getItem(LS_FB);
  if (!raw) return setSync('off','מקומי בלבד');
  setSync('off','מתחבר…');
  try {
    const cfg = JSON.parse(raw);
    const V = 'https://www.gstatic.com/firebasejs/10.12.5/';
    const [app, auth, fs, st] = await Promise.all([
      import(V+'firebase-app.js'), import(V+'firebase-auth.js'),
      import(V+'firebase-firestore.js'), import(V+'firebase-storage.js')
    ]);
    const a = app.initializeApp(cfg);
    const au = auth.getAuth(a);
    const cred = await auth.signInAnonymously(au);
    const db = fs.getFirestore(a);
    const ref = fs.doc(db, 'homeos', cred.user.uid);
    const storage = st.getStorage(a);
    fb = {fs, ref, st, storage, uid: cred.user.uid};

    remoteWrite = () => fs.setDoc(ref, JSON.parse(JSON.stringify({
      // photo (base64) stays local-only — only the Storage URL is synced
      items: S.items.map(({photo, ...rest}) => rest),
      spaces:S.spaces, cats:S.cats, extras:S.extras,
      events:S.events.slice(-200), meta:S.meta
    })), {merge:false}).catch(()=>setSync('err','שגיאת סנכרון'));

    fs.onSnapshot(ref, snap => {
      const d = snap.data();
      if (!d) { remoteWrite(); return; }
      if ((d.meta?.updatedAt||0) > (S.meta.updatedAt||0)) {
        const migrated = migrateState(d); // a remote doc from an older session may pre-date schema v2
        const photoCache = {};
        S.items.forEach(i => { if (i.photo) photoCache[i.id] = i.photo; });
        S = Object.assign(S, migrated);
        S.items = (S.items||[]).map(i => photoCache[i.id] ? {...i, photo:photoCache[i.id]} : i);
        localStorage.setItem(LS_DATA, JSON.stringify(S));
        render(); toast('סונכרן ממכשיר אחר');
      }
      setSync('on','מסונכרן');
    }, () => setSync('err','אין הרשאה ל-Firestore'));

    setSync('on','מסונכרן');
  } catch(e){
    console.error(e);
    setSync('err','החיבור נכשל — עובד מקומית');
  }
}
function pushRemote(){ if (remoteWrite) remoteWrite(); }

/* uploads the compressed photo to Firebase Storage and records its URL.
   Fires after the item is already saved locally, so a slow network or a
   missing Storage setup never costs the user their item — only the
   cross-device copy of the photo. */
async function uploadItemPhoto(item, dataUrl){
  if (!fb || !fb.storage) return;
  try {
    const blob = await (await fetch(dataUrl)).blob();
    const path = `homeos/${fb.uid}/items/${item.id}.jpg`;
    const sref = fb.st.ref(fb.storage, path);
    await fb.st.uploadBytes(sref, blob, {contentType:'image/jpeg'});
    item.photoUrl = await fb.st.getDownloadURL(sref);
    save();
  } catch(e){
    console.error(e);
    toast('התמונה נשמרה מקומית, אך ההעלאה לענן נכשלה');
  }
}

function snap(){
  if (shots.length >= MAX_SHOTS) return toast(`מקסימום ${MAX_SHOTS} תמונות`);
  const v = $('cam');
  if (!v.videoWidth) return;
  const max = 1024;
  const scale = Math.min(1, max / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(v.videoWidth * scale);
  c.height = Math.round(v.videoHeight * scale);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  shots.push(c.toDataURL('image/jpeg', 0.75));
  updateShots();
  if (navigator.vibrate) navigator.vibrate(30);
}

function updateShots(){
  const el = $('shots'); if(!el) return;
  el.innerHTML = shots.map((s,i)=>
    `<figure><img src="${s}" alt=""><button data-shot="${i}">×</button></figure>`).join('');
  el.querySelectorAll('[data-shot]').forEach(b => b.onclick = () => {
    shots.splice(Number(b.dataset.shot),1); updateShots();
  });
  $('nShots').textContent = shots.length ? `(${shots.length})` : '';
  $('analyze').style.opacity = shots.length ? '1' : '.45';
}

/* ---------- optional local Gemini key (interim — until there's a real backend) ---------- */
const LS_GKEY = 'homeos_gkey';
function localGeminiKey(){ return (localStorage.getItem(LS_GKEY) || '').trim(); }

async function callGeminiDirect(prompt, imagesB64, schema, key, model){
  const parts = [];
  if (imagesB64) imagesB64.forEach(data => parts.push({ inline_data:{ mime_type:'image/jpeg', data } }));
  parts.push({ text: prompt });
  const payload = {
    contents:[{ role:'user', parts }],
    generationConfig:{ temperature:0.1, responseMimeType:'application/json', responseSchema:schema },
    safetySettings:[]
  };
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model||'gemini-2.5-flash'}:generateContent`;
  const res = await fetch(url, {
    method:'POST', headers:{'Content-Type':'application/json','x-goog-api-key':key},
    body: JSON.stringify(payload)
  });
  if (!res.ok){
    const t = await res.text().catch(()=>'');
    throw new Error(`Gemini ${res.status}: ${t.slice(0,140)}`);
  }
  const data = await res.json();
  const text = data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('') || '';
  try { return JSON.parse(text); }
  catch { throw new Error('תשובת המודל לא הייתה JSON תקין'); }
}

/* same prompt + schema as src/ai-hub.js's scan_shelf task, kept in sync by hand */
function scanShelfPrompt(space, cats, catalog){
  return [
    'You are an inventory scanner for a household stock-tracking app. The user photographed',
    'a shelf, cabinet or drawer. Identify every distinct consumer product you can see.',
    '',
    'Rules:',
    '- Count identical products as one entry with qty = number of units visible.',
    '- Read brand names from labels when legible. Hebrew and English labels both occur.',
    '- Write "name" as the generic product type in Hebrew (שמפו, מרכך, נוזל כלים, קפה טחון),',
    '  including the flavour/variant/scent when it is printed on the package (e.g.',
    '  "קפה נמס בטעם וניל", not just "קפה נמס"). A vague name is worse than a specific one.',
    '- Write "brand" in its original script as printed on the package. Empty string if unreadable.',
    '- Skip anything that is not a stockable consumer product: furniture, fixtures, towels,',
    '  electrical outlets, the wall, the shelf itself, decorations, plants.',
    '- Do NOT guess at products that are hidden, out of focus, or only partly visible.',
    '  Under-reporting is much better than inventing items.',
    '',
    space ? `The user is currently viewing the space: "${space}".` : '',
    '',
    'Assign each item a "catId" from this exact list (use the id, never the name):',
    ...cats.map(c => `  ${c.id} = ${c.name}`),
    '',
    catalog.length
      ? [
          'CRITICAL — matching against existing stock:',
          'The user already has these items in stock. Before treating something as a new product,',
          'check hard whether it is actually one of these — same product, possibly photographed at a',
          'different angle or under different lighting than when it was first added. Prefer matching',
          'over creating a duplicate whenever you are reasonably confident, even if you cannot read',
          'every character on the label. When you do set "matchId": copy that item\'s "name" and',
          '"brand" back EXACTLY character-for-character from this list below — do not rephrase,',
          'reorder, add, or drop words, even if your own reading of the label differs slightly.',
          'Consistent naming across scans is what keeps the same product from being re-added as a',
          'second, separate item every time it gets photographed again.',
          'If genuinely no existing item matches, set matchId to an empty string.',
          ...catalog.map(i => `  ${i.id} = ${i.name}${i.brand ? ' / ' + i.brand : ''}`)
        ].join('\n')
      : 'The user has no existing stock. Set matchId to an empty string for every item.',
    '',
    'Return JSON only.'
  ].join('\n');
}
const SCAN_SCHEMA = {
  type:'OBJECT', properties:{ items:{ type:'ARRAY', items:{ type:'OBJECT', properties:{
    name:{type:'STRING'}, brand:{type:'STRING'}, qty:{type:'INTEGER'}, catId:{type:'STRING'}, matchId:{type:'STRING'}
  }, required:['name','qty','catId'] } } }, required:['items']
};

async function scanShelfDirect(images, space, cats, catalog, key){
  const prompt = scanShelfPrompt(space, cats, catalog);
  const parsed = await callGeminiDirect(prompt, images, SCAN_SCHEMA, key, null);
  const catIds = cats.map(c=>c.id), validIds = new Set(catalog.map(i=>i.id));
  return (parsed.items || [])
    .filter(i => i && typeof i.name === 'string' && i.name.trim())
    .slice(0, 60)
    .map(i => ({
      name:String(i.name).trim().slice(0,80), brand:String(i.brand||'').trim().slice(0,60),
      qty:Math.min(99, Math.max(0, parseInt(i.qty)||1)),
      catId: catIds.includes(i.catId) ? i.catId : (catIds[0]||''),
      matchId: validIds.has(i.matchId) ? i.matchId : ''
    }));
}

function dedupeCatalogPrompt(catalog){
  return [
    'You are reviewing a household inventory app\'s product list for duplicate entries —',
    'the same physical product that got added to the list more than once, usually because',
    'it was named slightly differently each time (a flavour word dropped, brand casing',
    'differs, extra descriptive text in parentheses, singular vs plural, etc).',
    '',
    'Group together only items you are reasonably confident are the exact same product.',
    'Different scents, flavours, sizes, or variants of the same brand are NOT duplicates',
    '(e.g. "דאודורנט AXE וניל" and "דאודורנט AXE קרמל" must stay separate). When genuinely',
    'unsure, leave the item out of any group rather than guessing.',
    '',
    'Each group needs 2 or more item ids and a short reason in Hebrew explaining the match.',
    'Do not include an item in more than one group. Items with no duplicate should not',
    'appear anywhere in the output.',
    '',
    'Inventory (id = name / brand / current qty):',
    ...catalog.map(i => `  ${i.id} = ${i.name}${i.brand ? ' / ' + i.brand : ''} / qty ${Number(i.qty)||0}`),
    '',
    'Return JSON only.'
  ].join('\n');
}
const DEDUPE_SCHEMA = {
  type:'OBJECT', properties:{ groups:{ type:'ARRAY', items:{ type:'OBJECT', properties:{
    ids:{type:'ARRAY', items:{type:'STRING'}}, reason:{type:'STRING'}
  }, required:['ids','reason'] } } }, required:['groups']
};

async function dedupeCatalogDirect(catalog, key){
  if (catalog.length < 2) return [];
  const parsed = await callGeminiDirect(dedupeCatalogPrompt(catalog), null, DEDUPE_SCHEMA, key, null);
  const validIds = new Set(catalog.map(i=>i.id));
  const seen = new Set(), groups = [];
  for (const g of (parsed.groups || [])){
    const ids = [...new Set((g.ids||[]).filter(id => validIds.has(id) && !seen.has(id)))];
    if (ids.length < 2) continue;
    ids.forEach(id=>seen.add(id));
    groups.push({ ids, reason:String(g.reason||'').trim().slice(0,200) });
  }
  return groups;
}

/* ---------- client-side duplicate guard ----------
   The model's own matchId is a judgment call against a text list — this is
   a second, independent, free check: plain token overlap. It only ever
   *suggests*; nothing merges without an explicit tap. Also the basis for
   family-name suggestions in openItem (same similarity(), different use). */
function normTokens(s){
  return (s||'').toLowerCase()
    .replace(/[()׳"'.,\-–]/g,' ')
    .split(/\s+/).filter(Boolean);
}
function similarity(nameA, brandA, nameB, brandB){
  const a = new Set(normTokens(nameA + ' ' + (brandA||'')));
  const b = new Set(normTokens(nameB + ' ' + (brandB||'')));
  if (!a.size || !b.size) return 0;
  const inter = [...a].filter(t => b.has(t)).length;
  const union = new Set([...a, ...b]).size;
  let score = union ? inter / union : 0;
  if (brandA && brandB && brandA.toLowerCase().trim() === brandB.toLowerCase().trim()) score += 0.15;
  return score;
}
function fuzzyCandidate(name, brand, excludeId){
  let best = null, bestScore = 0;
  S.items.forEach(it => {
    if (it.id === excludeId) return;
    const score = similarity(name, brand, it.name, it.brand);
    if (score > bestScore){ bestScore = score; best = it; }
  });
  return bestScore >= 0.5 ? {item:best, score:bestScore} : null;
}
function findDuplicatePairs(){
  const pairs = [];
  for (let i = 0; i < S.items.length; i++){
    for (let j = i + 1; j < S.items.length; j++){
      const a = S.items[i], b = S.items[j];
      const score = similarity(a.name, a.brand, b.name, b.brand);
      if (score >= 0.5) pairs.push({a, b, score, reason:null});
    }
  }
  return pairs.sort((x,y) => y.score - x.score);
}

/* ---------- catalog-wide cleanup: nothing merges without an explicit tap ---------- */
let dedupePairs = [];

function openDedupe(){

function paintDedupeList(){
  const list = $('ddList'), count = $('ddCount');
  if (!list) return;
  if (!dedupePairs.length){
    count.textContent = 'לא נמצאו זוגות חשודים בבדיקה המקומית.';
    list.innerHTML = '';
    return;
  }
  count.textContent = `${dedupePairs.length} זוגות אפשריים — תבחר איזה שם נשאר, או שאלה אינם זהים.`;
  list.innerHTML = dedupePairs.map((p,i) => `
    <div class="group" style="margin-bottom:8px">
      <div style="padding:10px 11px">
        ${p.reason ? `<div class="muted" style="margin-bottom:6px">🤖 ${esc(p.reason)}</div>` : ''}
        <div class="two">
          <button class="btn g" data-keep="${i}:a" style="text-align:right;font-size:12.5px;padding:9px">
            ✓ ${esc(p.a.name)}<br><span class="muted">${esc(p.a.brand||'')} · יש ${p.a.qty}</span>
          </button>
          <button class="btn g" data-keep="${i}:b" style="text-align:right;font-size:12.5px;padding:9px">
            ✓ ${esc(p.b.name)}<br><span class="muted">${esc(p.b.brand||'')} · יש ${p.b.qty}</span>
          </button>
        </div>
        <button class="btn" data-skip="${i}" style="margin-top:6px;background:transparent;color:var(--text-3);font-size:12px;padding:6px">אלה לא אותו מוצר</button>
      </div>
    </div>`).join('');

  list.querySelectorAll('[data-keep]').forEach(btn => btn.onclick = () => {
    const [idx, side] = btn.dataset.keep.split(':');
    const p = dedupePairs[Number(idx)];
    mergeDuplicates(side === 'a' ? p.a.id : p.b.id, side === 'a' ? p.b.id : p.a.id);
  });
  list.querySelectorAll('[data-skip]').forEach(btn => btn.onclick = () => {
    dedupePairs.splice(Number(btn.dataset.skip), 1);
    paintDedupeList();
  });
}

function mergeDuplicates(keepId, dropId){
  const keep = S.items.find(x => x.id === keepId);
  const drop = S.items.find(x => x.id === dropId);
  if (!keep || !drop){
    dedupePairs = dedupePairs.filter(p => p.a.id !== dropId && p.b.id !== dropId);
    paintDedupeList();
    return;
  }
  const addQty = Number(drop.qty) || 0;
  keep.qty = (Number(keep.qty) || 0) + addQty;
  logEvent('CORRECTION', keep.id, addQty, `מוזג עם "${drop.name}"`);
  logEvent('DELETE', drop.id, -addQty, drop.name);
  S.items = S.items.filter(x => x.id !== dropId);
  dedupePairs = dedupePairs.filter(p => p.a.id !== dropId && p.b.id !== dropId);
  save();
  toast(`מוזג לתוך "${keep.name}"`);
  paintDedupeList();
}

async function runAiDedupe(){
  const btn = $('ddAi');
  btn.innerHTML = '<span class="spin"></span> בודק…';
  btn.disabled = true;
  const gkey = localGeminiKey();
  try {
    const catalog = S.items.map(i => ({id:i.id, name:i.name, brand:i.brand||'', qty:i.qty}));
    let groups;
    if (gkey){
      groups = await dedupeCatalogDirect(catalog, gkey);
    } else {
      const res = await fetch(AI_ENDPOINT, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ task: 'dedupe_catalog', catalog })
      });
      if (!res.ok) throw new Error((await res.json().catch(()=>({}))).error || `שגיאה ${res.status}`);
      groups = (await res.json()).groups || [];
    }
    const existing = new Set(dedupePairs.map(p => [p.a.id,p.b.id].sort().join('|')));
    let added = 0;
    groups.forEach(g => {
      const ids = g.ids.filter(id => S.items.some(x=>x.id===id));
      for (let k = 1; k < ids.length; k++){
        const key = [ids[0], ids[k]].sort().join('|');
        if (existing.has(key)) continue;
        const a = S.items.find(x=>x.id===ids[0]), b = S.items.find(x=>x.id===ids[k]);
        if (!a || !b) continue;
        existing.add(key);
        dedupePairs.push({a, b, score:1, reason:g.reason||null});
        added++;
      }
    });
    btn.disabled = false; btn.innerHTML = 'בדוק גם עם AI (בדיקה עמוקה יותר)';
    toast(added ? `${added} זוגות נוספים נמצאו` : 'ה-AI לא מצא כפילויות נוספות');
    paintDedupeList();
  } catch(err){
    btn.disabled = false; btn.innerHTML = 'בדוק גם עם AI (בדיקה עמוקה יותר)';
    toast('הבדיקה נכשלה: ' + err.message);
  }
}
