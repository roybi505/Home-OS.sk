/* ---------- "Ask Home OS" (Phase 9) ----------
   Free-text Hebrew -> structured proposed operations -> confirmation
   sheet -> only on explicit approval do the normal mutation/save/event
   functions run. The AI never touches S directly, in either path. */
function parseCommandPrompt(text, catalog, cats){
  return [
    'You are a household inventory assistant. The user typed a short Hebrew (or mixed',
    'Hebrew/English) sentence describing something that just happened at home. Turn it',
    'into a structured list of proposed inventory operations. You NEVER change anything',
    'yourself — you only propose; the app shows the user a confirmation screen first.',
    '',
    'Recognize commands like:',
    '- "קניתי 3 דאודורנטים של Nivea"   -> increase_qty (or create_item if new), qty 3',
    '- "נגמר לי החלב"                    -> decrease_qty toward 0 for the matching item',
    '- "תוסיף קפה לרשימת הקניות"        -> add_shopping_extra',
    '- "יש לי עוד שני שמפו"              -> increase_qty, qty 2',
    '',
    'Also recognize READ-ONLY QUESTIONS — the user is asking, not commanding:',
    '- "כמה שמפו יש לי"              -> intent "query", query.type "count", query.itemName "שמפו"',
    '- "מה חסר?" / "מה צריך לקנות"   -> intent "query", query.type "shopping_list"',
    '- "מה דורש תשומת לב"            -> intent "query", query.type "low_stock"',
    '- "מה יש במקרר/במזווה/במקפיא"   -> intent "query", query.type "zone",',
    '  query.zone "fridge"/"pantry"/"freezer" respectively',
    '',
    'For a question like these, return intent "query", an EMPTY operations array,',
    'and fill in "query". You NEVER answer the question yourself with a number or a',
    'fact — you only classify which question it is; the app looks up the real answer',
    'from its own local data. If a sentence is neither a clear command nor a',
    'recognizable question type, use intent "unknown" with empty operations and no query.',
    '',
    'For each operation (when the sentence is a command, not a question):',
    '- If the product clearly matches something in the existing catalog below, set',
    '  "itemId" to that id and "name" to that item\'s exact existing name.',
    '- If it does not match anything existing AND the user clearly means to add it as',
    '  a tracked product (not just mention it), use action "create_item", itemId empty.',
    '- For a bare "add X to the list" with no clear existing item, use',
    '  "add_shopping_extra" instead (itemId empty, action only, no separate item created).',
    '- Guess "inventoryMode" (supply/kitchen) and "kitchenZone" (pantry/fridge/freezer)',
    '  only for create_item; leave both empty otherwise.',
    '- "confidence" is your own 0-1 estimate of how sure you are.',
    '- Only do arithmetic directly implied by the sentence (e.g. "עוד שניים" = +2).',
    '  Never invent a quantity the user did not say or clearly imply.',
    '',
    'If the sentence has nothing to do with the household inventory, return intent',
    '"unknown", an empty operations array, and a short honest message explaining that.',
    '',
    'Existing catalog (id = name / brand):',
    catalog.length ? catalog.map(i=>`  ${i.id} = ${i.name}${i.brand?' / '+i.brand:''}`).join('\n') : '  (empty)',
    '',
    'Categories (id = name):',
    cats.map(c=>`  ${c.id} = ${c.name}`).join('\n'),
    '',
    `User said: "${text.replace(/"/g,"'")}"`,
    '',
    'Return JSON only.'
  ].join('\n');
}
const PARSE_SCHEMA = {
  type:'OBJECT',
  properties:{
    intent:{type:'STRING'}, message:{type:'STRING'},
    operations:{ type:'ARRAY', items:{ type:'OBJECT', properties:{
      action:{type:'STRING'}, itemId:{type:'STRING'}, name:{type:'STRING'},
      qty:{type:'INTEGER'}, inventoryMode:{type:'STRING'}, kitchenZone:{type:'STRING'},
      confidence:{type:'NUMBER'}
    }, required:['action','name','qty'] } },
    query:{ type:'OBJECT', properties:{
      type:{type:'STRING'}, itemName:{type:'STRING'}, zone:{type:'STRING'}
    } }
  },
  required:['intent','message','operations']
};
const QUERY_TYPES = ['count','low_stock','shopping_list','zone','unknown'];

function sanitizeParseResult(parsed, catalog){
  const validIds = new Set(catalog.map(i=>i.id));
  const ops = (parsed.operations||[]).slice(0,20).map(o => ({
    action: String(o.action||'').trim(),
    itemId: validIds.has(o.itemId) ? o.itemId : '',
    name: String(o.name||'').trim().slice(0,80),
    qty: Math.max(0, parseInt(o.qty)||0),
    inventoryMode: (o.inventoryMode==='kitchen'||o.inventoryMode==='supply') ? o.inventoryMode : '',
    kitchenZone: ['fridge','pantry','freezer'].includes(o.kitchenZone) ? o.kitchenZone : '',
    confidence: Math.max(0, Math.min(1, Number(o.confidence)||0))
  })).filter(o => o.action && o.name);
  const rawQuery = parsed.query && typeof parsed.query === 'object' ? parsed.query : null;
  const query = rawQuery ? {
    type: QUERY_TYPES.includes(rawQuery.type) ? rawQuery.type : 'unknown',
    itemName: String(rawQuery.itemName||'').trim().slice(0,80),
    zone: ['fridge','pantry','freezer'].includes(rawQuery.zone) ? rawQuery.zone : ''
  } : null;
  return { intent:String(parsed.intent||'unknown').slice(0,40), message:String(parsed.message||'').slice(0,200), operations:ops, query };
}

async function parseCommandDirect(text, catalog, cats, key){
  const parsed = await callGeminiDirect(parseCommandPrompt(text,catalog,cats), null, PARSE_SCHEMA, key, null);
  return sanitizeParseResult(parsed, catalog);
}

/* ---------- read-only queries ----------
   The model only classifies WHICH question this is (query.type/itemName/
   zone) — it never states a number or a fact itself. Every answer here is
   composed from S directly, so "how much X" always reflects real stock,
   never a model guess. */
function answerQuery(q){
  q = q || {};
  const type = q.type || 'unknown';
  const itemName = (q.itemName || '').trim();

  if (type === 'count'){
    if (!itemName) return 'לא ציינת איזה מוצר.';
    const low = itemName.toLowerCase();
    const hit = S.items.find(it => (it.name||'').toLowerCase().includes(low) || (it.brand||'').toLowerCase().includes(low))
      || (fuzzyCandidate(itemName, '', null) || {}).item;
    if (!hit) return `לא מצאתי מוצר בשם "${itemName}" במלאי.`;
    return `יש לך ${Number(hit.qty)||0} ${hit.name}${hit.brand?' ('+hit.brand+')':''} במלאי.`;
  }

  if (type === 'low_stock'){
    const list = getNeedsAttention();
    if (!list.length) return 'הכל תקין — שום דבר לא דורש תשומת לב כרגע.';
    return 'דורשים תשומת לב: ' + list.slice(0,8).map(it => `${it.name} (יש ${Number(it.qty)||0})`).join(', ');
  }

  if (type === 'shopping_list') return shopText();

  if (type === 'zone' && ZONES.includes(q.zone)){
    const items = getKitchenItemsByZone(q.zone);
    if (!items.length) return `אין פריטים רשומים ב${ZONE_LABEL[q.zone]}.`;
    return `ב${ZONE_LABEL[q.zone]}: ` + items.map(it => `${it.name} (${Number(it.qty)||0})`).join(', ');
  }

  return 'לא הצלחתי לזהות שאלה על המלאי. נסה לנסח אחרת.';
}

          <label class="row grow" style="gap:7px">
            <input type="checkbox" class="opKeep" checked style="width:18px;height:18px;flex:none">
            <span class="grow trunc" style="font-weight:600;font-size:13.5px">${esc(existing?existing.name:op.name)}</span>
          </label>
          <span class="pill ${opPillClass(op.action)}">${opLabel(op.action)}</span>
        </div>
        <div class="two">
          <input class="opQty" type="number" inputmode="numeric" min="0" value="${op.qty||1}">
          <div class="muted" style="align-self:center">ביטחון: ${Math.round((op.confidence||0)*100)}%</div>
        </div>
      </div>`;
    }).join('')}</div>
    <button class="btn a" id="askApply" style="margin-top:14px">אישור וביצוע</button>
    <button class="btn g" id="askCancel" style="margin-top:8px">ביטול</button>
  `, () => {
    $('askCancel').onclick = closeSheet;
    $('askApply').onclick = () => {
      let n = 0;
      document.querySelectorAll('.srow').forEach((row,i) => {
        if (!row.querySelector('.opKeep').checked) return;
        const qty = Math.max(0, parseInt(row.querySelector('.opQty').value)||0);
        applyAskOperation(result.operations[i], qty);
        n++;
      });
      closeSheet(); save();
      toast(n ? `${n} פעולות בוצעו` : 'לא סומן כלום');
    };
  });
}

/* the only place an AI-proposed operation actually touches S — and only
   after the user tapped "אישור וביצוע" above. Reuses the same mutation
   shape (logEvent + qty math) as every other path in the app. */
function applyAskOperation(op, qty){
  if (op.action === 'add_shopping_extra'){
    S.extras.push({id:uid(), text:op.name, got:false});
    return;
  }
  let it = op.itemId ? S.items.find(x=>x.id===op.itemId) : null;
  if (!it && op.action !== 'create_item') op = {...op, action:'create_item'};
  if (op.action === 'create_item' && !it){
    it = {
      id:uid(), name:op.name, brand:'', spaceId:S.spaces[0].id, catId:S.cats[0].id,
      qty:0, target:Math.max(1, qty), note:'', photo:'', photoUrl:'',
      inventoryMode: op.inventoryMode || 'supply',
      kitchenZone: op.inventoryMode==='kitchen' ? (op.kitchenZone||'pantry') : null,
      familyId:null, familyName:'', variantName:'', createdAt:Date.now()
    };
    S.items.push(it);
  }
  if (!it) return;
  if (op.action === 'decrease_qty'){
    const next = Math.max(0, (Number(it.qty)||0) - qty);
    logEvent('USED', it.id, next - it.qty, 'פקודה חופשית');
    it.qty = next;
  } else {
    logEvent('PURCHASE', it.id, qty, 'פקודה חופשית');
    it.qty = (Number(it.qty)||0) + qty;
  }
}

function sheet(html, after){
  $('modals').innerHTML = `<div class="overlay"><div class="sheet">${html}</div></div>`;
  const ov = document.querySelector('.overlay');
  ov.onclick = e => { if (e.target === ov) closeSheet(); };
  if (after) after();
}
function closeSheet(){ stopCam(); $('modals').innerHTML = ''; }

/* ---------- events ----------
   One delegated listener for everything repeated-per-item or per-tab;
   only elements unique to a single tab's markup get bound directly, in
   wireTabExtras() (called at the end of every render()). */
document.addEventListener('click', e => {
  const t = e.target.closest(
    '[data-q],[data-edit],[data-sp],[data-ct],[data-tab],[data-zone],' +
    '[data-fam],[data-kitchen-item],[data-need],[data-xgot],[data-xdel],' +
    '[data-shopsuggest],[data-insight-accept],[data-insight-dismiss]'
  );
  if (!t) return;
  if (t.dataset.q !== undefined){
    const it = S.items.find(i=>i.id===t.dataset.q);
    const d = Number(t.dataset.d);
    const next = Math.max(0, (Number(it.qty)||0) + d);
    if (next === it.qty) return;
    it.qty = next;
    logEvent(d > 0 ? 'PURCHASE' : 'USED', it.id, d, 'כפתור מהיר');
    save();
  } else if (t.dataset.edit !== undefined){ openItem(t.dataset.edit); }
  else if (t.dataset.tab !== undefined){ UI.tab = t.dataset.tab; UI.q = ''; UI.shopQ = ''; render(); }
  else if (t.dataset.zone !== undefined){ UI.zone = t.dataset.zone; render(); }
  else if (t.dataset.fam !== undefined){ openFamily(t.dataset.fam); }
  else if (t.dataset.kitchenItem !== undefined){ openKitchenActions(t.dataset.kitchenItem); }
  else if (t.dataset.need !== undefined){
    const it = S.items.find(i=>i.id===t.dataset.need); if (it){ it._got = !it._got; render(); }
  }
  else if (t.dataset.sp !== undefined){ UI.space = t.dataset.sp; render(); }
  else if (t.dataset.ct !== undefined){ UI.cat = t.dataset.ct; render(); }
  else if (t.dataset.xgot !== undefined){
    const ex = S.extras.find(x=>x.id===t.dataset.xgot); if (ex){ ex.got = !ex.got; save(false); }
  }
  else if (t.dataset.xdel !== undefined){
    S.extras = S.extras.filter(x=>x.id!==t.dataset.xdel); save(false);
  }
  else if (t.dataset.shopsuggest !== undefined){ commitShopAdd(t.dataset.shopsuggest); }
  else if (t.dataset.insightAccept !== undefined){
    const ins = computeInsights().find(i=>i.id===t.dataset.insightAccept);
    if (ins) addShoppingItemRef(ins.itemId);
  }
  else if (t.dataset.insightDismiss !== undefined){ dismissInsight(t.dataset.insightDismiss); }
});

/* static chrome (header, ask bar, tab bar) is never replaced by render(),
   so these bind once at boot — unlike the tab-specific elements inside #view */
$('btnSettings').onclick = openSettings;
$('askSend').onclick = submitAsk;
$('askInput').onkeydown = e => { if (e.key==='Enter') submitAsk(); };
$('askCam').onclick = openScanner;
$('askCam').innerHTML = iconSvg('camera',18);
$('askSend').innerHTML = iconSvg('send',18);
document.querySelectorAll('.tabbar button[data-tab]').forEach(b=>{
  const key = b.dataset.tab;
  const iconKey = key==='home' ? 'home' : key==='supplies' ? 'bottle' : key==='kitchen' ? 'fridge' : 'cart';
  b.querySelector('.icon').outerHTML = iconSvg(iconKey, 20);
});

/* ---------- boot ---------- */
load(); render(); initFirebase();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
